<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Arc Connect Portal{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/arc.css') }}">
  <style>
    /* Embed-mode chrome reset — used when this page is iframed inside another
       dashboard view (e.g., /parent embeds /heatmap?embed=1 in place of the
       legacy Network Map card). Strips topbar, footer, page padding so the
       embedded content fills the iframe edge to edge. */
    body { margin: 0; padding: 0; background: #fff; }
    body.embed-mode .page,
    body.embed-mode .page-header,
    body.embed-mode .topbar,
    body.embed-mode .footer { padding-top: 0 !important; padding-bottom: 0 !important; }
    body.embed-mode { overflow-x: hidden; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="embed-mode">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
